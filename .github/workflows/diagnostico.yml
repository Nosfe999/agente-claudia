name: diagnostico

on:
  workflow_dispatch:

jobs:
  fuentes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probar fuentes gratuitas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: python -m agent.diagnose
