name: backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest de la señal técnica (últimos ~58 días)
        env:
          DATA_DIR: out
        run: python -m agent.backtest
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: out/backtest.json
