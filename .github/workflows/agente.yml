name: agente

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub puede retrasarlo 5-30 min en horas pico
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: agente
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      WEEKEND_BTC_PUSH: ${{ vars.WEEKEND_BTC_PUSH }}
      DIGEST_ONLY: ${{ vars.DIGEST_ONLY }}
      LLM_ORDER: ${{ vars.LLM_ORDER }}
      LLM_TIMEOUT_S: ${{ vars.LLM_TIMEOUT_S }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      MIN_SEVERITY: ${{ vars.MIN_SEVERITY }}
      LOCAL_TZ: ${{ vars.LOCAL_TZ }}
      DATA_DIR: data-out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cargar datos previos (rama data)
        run: |
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch data "$REMOTE" data-out 2>/dev/null || mkdir -p data-out
          rm -rf data-out/.git

      - name: Ejecutar ciclo del agente
        run: python -m agent.run

      - name: Publicar datos (un solo commit, sin historial)
        run: |
          cd data-out
          git init -q -b data
          git config user.name "agente-bot"
          git config user.email "agente-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "datos $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin data

      - name: Mantener el cron activo (GitHub lo pausa tras 60 días sin actividad)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable agente.yml --repo "${{ github.repository }}"
